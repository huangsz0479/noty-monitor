[package]
name = "sysmon-win"
version = "0.1.0"
edition = "2021"
publish = false
description = "SysMon Windows 壳：贴边窗口与系统采集"

[[bin]]
name = "sysmon"
path = "src/main.rs"

[dependencies]
battery = "0.7.8"
if-addrs = "0.15.0"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
tao = "0.37"
ureq = "3.4.2"
wry = "0.57"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow", "NSScreen"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry", "objc2-core-foundation"] }
