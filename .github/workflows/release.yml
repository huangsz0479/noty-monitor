name: Release

# 手动发版:输入版本号,构建 universal 包并挂到 GitHub Release。
# 不再继承 noty 的 push-to-main 自动发版——没有 Sparkle/appcast,
# 也没有按架构拆 DMG,一个 universal zip 覆盖两种架构。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.0'
        required: true

permissions:
  contents: write

# 两次发版撞车时排队,不互相取消。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Select the newest installed Xcode
        run: |
          LATEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Work out the version
        id: v
        # Nothing from the event reaches the shell as ${{ }}: a dispatch input is
        # attacker-controlled text, and interpolating it here would run it.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be numeric SemVer (X.Y.Z)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::notice::v${VERSION} is already tagged — nothing to release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "build=$(git rev-list --count HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "releasing ${VERSION}"

      - name: Build
        if: steps.v.outputs.skip != 'true'
        env:
          MARKETING_VERSION: ${{ steps.v.outputs.version }}
          BUILD_NUMBER: ${{ steps.v.outputs.build }}
        run: |
          ./build.sh release
          lipo -info mac/build/SysMon.app/Contents/MacOS/SysMon | grep -Eq 'arm64.*x86_64|x86_64.*arm64'
          codesign --verify --deep --strict mac/build/SysMon.app

      - name: Package
        if: steps.v.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # ditto 保留元数据与签名,是分发 .app 的正确打包方式。
          ditto -c -k --keepParent mac/build/SysMon.app "mac/build/SysMon-${VERSION}.zip"
          shasum -a 256 "mac/build/SysMon-${VERSION}.zip" > mac/build/SHA256SUMS.txt

      - name: Publish the release
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "mac/build/SysMon-${VERSION}.zip" mac/build/SHA256SUMS.txt \
            --title "SysMon ${VERSION}" \
            --target "$GITHUB_SHA" \
            --notes "Universal binary(Apple Silicon 与 Intel)。下载解压后把 SysMon.app 拖入「应用程序」即可。" \
            --latest
