name: Build

on:
  push:
    branches: [main, dev]
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 部署目标是 macosx26.0,默认工具链的 SDK 可能不够新,选最新的 Xcode。
      - name: Select the newest installed Xcode
        run: |
          LATEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Build
        run: ./build.sh release

      - name: Verify the bundle
        run: |
          test -x build/SysMon.app/Contents/MacOS/SysMon
          lipo -info build/SysMon.app/Contents/MacOS/SysMon | grep -Eq 'arm64.*x86_64|x86_64.*arm64'
          codesign --verify --deep --strict build/SysMon.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/SysMon.app/Contents/Info.plist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SysMon-app
          path: build/SysMon.app
